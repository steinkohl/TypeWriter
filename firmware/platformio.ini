; PlatformIO project for the Mega firmware (TypewriterBridge).
;
;   pio run                 compile
;   pio run -t upload       flash (stop typewriterd first: it holds the port)
;   pio device monitor      talk to the firmware by hand (see docs/protocol.md)

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -Wall -Wextra
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
; upload_port = /dev/ttyACM0   ; auto-detected if unset
